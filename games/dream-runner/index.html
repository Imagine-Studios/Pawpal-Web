<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Dream Runner</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #17213b; }
    body { display: grid; place-items: center; overflow: hidden; }
    #game { position: relative; width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; color: white; font: 18px system-ui, sans-serif; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Dream Runner"></canvas>
    <div id="status" role="status">Cargando Dream Runner…</div>
  </main>
  <script src="Build/DreamRunnerRelease.loader.js"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const status = document.querySelector('#status');
    const english = new URLSearchParams(location.search).get('lang') === 'en';
    document.documentElement.lang = english ? 'en' : 'es';
    const loadingLabel = english ? 'Loading Dream Runner…' : 'Cargando Dream Runner…';
    status.textContent = loadingLabel;
    createUnityInstance(canvas, {
      dataUrl: 'Build/DreamRunnerRelease.data.unityweb',
      frameworkUrl: 'Build/DreamRunnerRelease.framework.js.unityweb',
      codeUrl: 'Build/DreamRunnerRelease.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      autoSyncPersistentDataPath: true,
      companyName: "OruStudio",
      productName: "Dream Runner",
      productVersion: "1.25",
      showBanner: (message, type) => {
        if (type === 'error') { status.hidden = false; status.style.display = 'grid'; status.textContent = message; }
        console[type === 'error' ? 'error' : 'warn'](message);
      }
    }, progress => { status.textContent = `${loadingLabel} ${Math.round(progress * 100)} %`; })
      .then(instance => { window.dreamRunner = instance; status.style.display = 'none'; document.body.dataset.gameReady = 'true'; canvas.focus(); })
      .catch(error => { status.textContent = String(error); console.error(error); });
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
